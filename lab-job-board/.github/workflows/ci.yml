name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r jobs-service/requirements.txt
          pip install pytest ruff httpx

      - name: Lint Python
        run: ruff check jobs-service/app jobs-service/tests

      - name: Run Python tests
        working-directory: jobs-service
        run: python -m pytest -q

  lint-test-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit applications-service dependencies
        working-directory: applications-service
        run: |
          npm install --no-fund --no-audit
          npm audit --omit=dev --audit-level=critical

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm install --no-fund --no-audit
          npm audit --omit=dev --audit-level=critical

  build-images:
    runs-on: ubuntu-latest
    needs: [lint-test-python, lint-test-node]
    env:
      POSTGRES_DB: jobboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CI_Strong_Pass_123
      NGINX_PORT: 8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

  scan-images:
    runs-on: ubuntu-latest
    needs: [build-images]
    env:
      POSTGRES_DB: jobboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CI_Strong_Pass_123
      NGINX_PORT: 8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy

      - name: Build Docker images
        run: docker compose build

      - name: Scan images with Trivy
        run: |
          trivy image --exit-code 0 --format table --output trivy-jobs-service.txt lab-job-board-jobs-service:latest
          trivy image --exit-code 0 --format table --output trivy-applications-service.txt lab-job-board-applications-service:latest
          trivy image --exit-code 0 --format table --output trivy-frontend.txt lab-job-board-frontend:latest
          trivy image --exit-code 0 --format table --output trivy-nginx.txt lab-job-board-nginx:latest

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-jobs-service.txt
            trivy-applications-service.txt
            trivy-frontend.txt
            trivy-nginx.txt

  integration-test:
    runs-on: ubuntu-latest
    needs: [build-images]
    env:
      POSTGRES_DB: jobboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CI_Strong_Pass_123
      NGINX_PORT: 8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for API readiness
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:${NGINX_PORT}/api/jobs > /dev/null && curl -sf http://localhost:${NGINX_PORT}/api/applications > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail 200
          exit 1

      - name: Run integration assertions
        run: |
          curl -sf http://localhost:${NGINX_PORT}/api/jobs | jq -e 'type == "array" and length >= 1' > /dev/null
          curl -sf http://localhost:${NGINX_PORT}/api/applications | jq -e 'type == "array"' > /dev/null

          NEW_JOB_ID=$(curl -sf -X POST http://localhost:${NGINX_PORT}/api/jobs \
            -H "Content-Type: application/json" \
            -d '{"title":"CI Pipeline Job","description":"Created by integration test for CI pipeline validation.","company":"CI","location":"Runner"}' | jq -r '.id')

          test -n "$NEW_JOB_ID" && [ "$NEW_JOB_ID" != "null" ]

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  push-to-registry:
    runs-on: ubuntu-latest
    needs: [scan-images, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      POSTGRES_DB: jobboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CI_Strong_Pass_123
      NGINX_PORT: 8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images
        run: docker compose build

      - name: Tag and push images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          for svc in jobs-service applications-service frontend nginx; do
            LOCAL_IMAGE="lab-job-board-${svc}:latest"
            REMOTE_IMAGE="${DOCKERHUB_USERNAME}/jobboard-${svc}"
            docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE:latest"
            docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE:$SHORT_SHA"
            docker push "$REMOTE_IMAGE:latest"
            docker push "$REMOTE_IMAGE:$SHORT_SHA"
          done
